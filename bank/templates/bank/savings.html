{% extends "bank/layout.html" %}

{% load static %}

{% block body %}

<head>
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <script type="text/javascript">
    google.charts.load('current', {'packages':['corechart']});
    google.charts.setOnLoadCallback(drawLineChart);

    document.addEventListener('DOMContentLoaded', function() {
    let selectmenu = document.querySelector("select")

    selectmenu.addEventListener("change", Change);
    })


function Change() {

  menu = document.querySelector("select")
  selection = menu.value;
  drawLineChart(selection);

}


    function drawLineChart(period) {
      if (period === undefined) {
          period = "Week";
        }
        var sdatalist = [];
        var url = `/savings_data/${period}`;
        console.log(period)
        fetch(url)
        .then(response => response.json())
        .then(result => {
        sdatalist = Array.from(result);
        console.log(sdatalist)
        if (sdatalist.length < 1){
          document.getElementById('donutchart').innerHTML = "<br><p>No data to display for this period.</p>"
        }
        else {

          var data = google.visualization.arrayToDataTable(sdatalist);
          var options = {
          title: `Savings Tracker by ${period}`,
          vAxis: { gridlines: { count: 4 }, format: 'currency' },
          legend: { position: 'bottom' }
      };

      var chart = new google.visualization.LineChart(document.getElementById('curve_chart'));
      chart.draw(data, options);
        }
        })

    }
  </script>
  </head>


  <body>
    <!-- Identify where the chart should be drawn. -->
    <div class="jumbotron" id="jumbro">
      <h3 class="display-4">Savings Tracker</h3>
      <form>
      {{ form.as_table }}
    </form>
  </div>

    <div id="curve_chart" style="width: 900px; height: 500px"></div>
  </body>


  {% endblock %}
  {% block script %}
      <script src="{% static 'bank/bank.js' %}"></script>
  {% endblock %}
